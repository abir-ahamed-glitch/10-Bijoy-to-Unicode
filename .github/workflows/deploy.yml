name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 371b5ee90b4835d12434ab1303087f85
        run: npx wrangler pages deploy . --project-name=bijoy-to-unicode --exclude=.agent --exclude=.deprecated --exclude=app_summary.pdf --exclude=README.md --exclude=.github --exclude=.gitignore --exclude=wrangler.toml

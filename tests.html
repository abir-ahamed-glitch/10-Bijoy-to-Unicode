<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversion Tests · Bijoy ⇄ Unicode</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
  <style>
    :root {
      --bg: #0B0E17;
      --panel: #141926;
      --border: #2A3142;
      --text: #E8EAF1;
      --muted: #8A91A4;
      --green: #43D98A;
      --red: #FC5C65;
      --yellow: #F7B731;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .summary {
      display: flex; gap: 12px; flex-wrap: wrap;
      padding: 14px 18px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 18px;
    }
    .stat { display: flex; align-items: baseline; gap: 6px; }
    .stat .num { font-size: 24px; font-weight: 700; }
    .stat .lbl { color: var(--muted); font-size: 12px; }
    .stat.pass .num { color: var(--green); }
    .stat.fail .num { color: var(--red); }
    .stat.skip .num { color: var(--yellow); }
    .controls { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .btn {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; font-size: 13px; cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { border-color: #4A5572; }
    .btn.primary { background: #4F46E5; border-color: #4F46E5; }
    .btn.primary:hover { background: #5B53E8; }
    .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .filter-bar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .cat-section { margin-bottom: 22px; }
    .cat-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      border-bottom: none;
    }
    .cat-title .count { color: var(--muted); font-weight: 400; font-size: 12px; }
    .test-list {
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }
    .test {
      display: grid;
      grid-template-columns: 24px 1fr 1fr 1fr;
      gap: 10px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      align-items: start;
    }
    .test:first-child { border-top: none; }
    .test.pass { background: rgba(67, 217, 138, 0.04); }
    .test.fail { background: rgba(252, 92, 101, 0.08); }
    .test.skip { background: rgba(247, 183, 49, 0.04); }
    .test .ico { font-size: 14px; }
    .test .ico.pass { color: var(--green); }
    .test .ico.fail { color: var(--red); }
    .test .ico.skip { color: var(--yellow); }
    .test .label { color: var(--muted); font-weight: 500; }
    .test .in, .test .expected, .test .actual {
      font-family: "SFMono-Regular", Consolas, monospace;
      word-break: break-all;
    }
    .test .actual.fail-text { color: var(--red); }
    .test .label-cell { display: flex; flex-direction: column; }
    .test .label-cell small { color: var(--muted); font-weight: 400; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    details { margin-top: 6px; }
    details summary { cursor: pointer; font-size: 11px; color: var(--muted); }
    details pre {
      background: rgba(0,0,0,0.3); padding: 8px;
      border-radius: 4px; font-size: 11px; margin-top: 4px;
      overflow: auto;
    }
  </style>
</head>

  const lower = clean.toLowerCase();

function protectEnglishTokens(text) {
  if (!text) return { text: '', map: [] };

  const map = [];
  const addProt = (match) => {
    const idx = map.length;
    map.push(match);
    return '\uE001' + String.fromCharCode(0xE100 + idx) + '\uE001';

  r = r.replace(/(?<![A-Za-z0-9_])((?:https?:\/\/|www\.)[^\s<>"'{}|\\^`]+)(?![A-Za-z0-9_])/g, addProt);

  r = r.replace(/(?:\(|\\[)(?:[ivxIVXLCDM]+)(?:\)|\\])/gi, addProt);

  r = r.replace(/(?<![A-Za-z0-9_\u0080-\uFFFF])([A-Za-z0-9]+(?:['’][a-zA-Z]+|\.)?)(?![A-Za-z0-9_\u0080-\uFFFF])/g, (token) => {

}

    if (r.includes(b)) {
      const idx = multiMap.length;
      multiMap.push(u);
      const placeholder = '\uE002' + String.fromCharCode(0xE200 + idx) + '\uE002';
      r = replAll(r, b, placeholder);
    }
  }

  // Step 0: Extract English phrases and words
  const { text: cleanR, engMap } = extractEngBulletproof(r);
  r = cleanR;

  // Step 1a: SutonnyMJ normalization
  r = r.replace(/&,/g, '~');
  const bijoyCons = '[K-Z_`a-z\u00b2\u00b0\u00b1\u00b3\u00b5\u00b6\u00b7\u00b8\u00bb\u00bc\u00bd\u00be\u00c0\u00c1\u00c2\u00c3\u00c4\u00c5\u00c6\u00c7\u00c8\u00c9\u00ca\u00cb\u00cc\u00ce\u00cf\u00d7\u00d8\u00d9\u00da\u00db\u00dc\u00de\u00df\u00e0\u00e1\u00e2\u00e3\u00e4\u00e5\u00e7\u00e9\u00ea\u00eb\u00ec\u00ed\u00ee\u00ef\u00f0\u00f1\u00f2\u00f3\u00f4\u00f5\u00f6\u00f7\u00f8\u00f9\u00fa\u00fb\u00fc\u00fd\u00fe\u00af\02c6\00af\2014\00af\2018\00af\00bf\00af\2039\00af\00fa\00af\00a7\00afc\00afb\00afl\00af\00f8]';
  const bijoyVowelKars = '[vwxyz~\u00e6\201e\2021\2020\2030\02c6\0160u]';
  r = r.replace(new RegExp(`(${bijoyCons})(?<!${bijoyVowelKars}),(?=[A-Za-z0-9])`, 'g'), '$1~');
  r = r.replace(/([A-Za-z0-9_`~\u00e6\201e\2021\2020\2030\02c6\u0080-\u00FF])uv/g, '$1vu');
  r = r.replace(/\u201A/g, '\u09C2').replace(/\u201E/g, '\u09C3');
  r = r.replace(/\u2021v/g, '\u09CB').replace(/\u2020v/g, '\u09CB');

  // Step 1b: Reph pre-pass
  const rephRx = new RegExp(`([\u2021\u2020w\u2030])?(${bijoyCons})\u00a9`, 'g');
  r = r.replace(rephRx, (_, v, c) => '\u00a9' + (v || '') + c);

  // Step 3: Single-char
  r = r.split('').map(c => B2U_SINGLE[c] ?? c).join('');

  // Step 4: Reorder left-side vowels using STRICT dynamicCons
  const dynamicCons = '(?:[ক-হৎড়ঢ়য়]|\\uE002[\\uE200-\\uE2FF]\\uE002)';
  const dynamicCluster = `${dynamicCons}(?:${BN_HAS}${dynamicCons})*`;
  r = r.replace(new RegExp(`(${LEFT_V})(${dynamicCluster})`,'g'), (_, v, cl) => cl + v);

  // Step 5: NFC
  r = r.normalize('NFC');

  // Step 6: Cleanup
  r = r.replace(/\u09CD\u09CD/g,'\u09CD')
       .replace(/\u09CD([\u09BE-\u09CC])/g, '$1')
       .replace(/\u09CD(?=\s|$)/g,'');

  // Restore Step 2 multi-char
  r = r.replace(/\uE002([\uE200-\uE2FF])\uE002/g, (_, c) => multiMap[c.charCodeAt(0) - 0xE200] || '');

  // Restore English words
  r = r.replace(/\uE000([০-৯0-9]+)\uE000/g, (_, dStr) => engMap[parseInt(toAsciiDigits(dStr), 10)] || '');

  // Restore protected pre-existing Unicode blocks
  r = r.replace(/\uE004([০-৯0-9]+)\uE004/g, (_, dStr) => uniBlocks[parseInt(toAsciiDigits(dStr), 10)] || '');

  // Final spelling fixes
  r = r.replace(/অাঁ/g, 'আঁ').replace(/অঁা/g, 'আঁ').replace(/আাঁ/g, 'আঁ');
  // r = r.replace(/([ািীুূৃৄোৌ])্(?=[ক-হ])/g, '$1');

  return r;
}

function bijoyToUnicode(text) {
  if (!text) return '';
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  return lines.map(bijoyToUnicodeSingleLine).join('\n');
}

function unicodeToBijoy(text) {
  if (!text) return '';
  // Normalize decomposed nukta combinations (য+nukta -> য়, ড+nukta -> ড়, ঢ+nukta -> ঢ়)
  let r = text.normalize('NFC')
    .replace(/\u09AF\u09BC/g, '\u09DF')
    .replace(/\u09A1\u09BC/g, '\u09DC')
    .replace(/\u09A2\u09BC/g, '\u09DD');

  // Step 0: Protect English tokens embedded in Bengali Unicode using unified protectEnglishTokens engine
  const { text: cleanR, map: engMap2 } = protectEnglishTokens(r);
  r = cleanR;

  const SINGLE_CLUSTER = '(?:[\u0995-\u09B9\u09CE\u09DC-\u09DF\u09BC](?:\u09CD[\u0995-\u09B9\u09CE\u09DC-\u09DF\u09BC])*(?:\u09CD[রয])?)';

  // Step 1: Handle Reph (র্ \u09B0\u09CD) + Cluster + Vowels
  const VOWEL_TO_BIJOY = {'\u09BF':'w', '\u09C7':'\u2021', '\u09C8':'\u2030'};
  r = r.replace(new RegExp(`\u09B0\u09CD(${SINGLE_CLUSTER})([\u09BF\u09C7\u09C8])`, 'g'), (_, cl, v) => (VOWEL_TO_BIJOY[v] || v) + cl + '\u00a9');
  r = r.replace(new RegExp(`\u09B0\u09CD(${SINGLE_CLUSTER})\u09CB`, 'g'), (_, cl) => '\u2021' + cl + '\u00a9' + '\u09BE');
  r = r.replace(new RegExp(`\u09B0\u09CD(${SINGLE_CLUSTER})\u09CC`, 'g'), (_, cl) => '\u2021' + cl + '\u00a9' + 'Š');
  r = r.replace(new RegExp(`\u09B0\u09CD(${SINGLE_CLUSTER})`, 'g'), (_, cl) => cl + '\u00a9');

  // Step 2: Split O-kar (ো \u09CB) and OU-kar (ৌ \u09CC) directly using Bijoy e-kar marker (‡)
  r = r.replace(new RegExp(`(${SINGLE_CLUSTER})\u09CB`, 'g'), (_, cl) => '\u2021' + cl + '\u09BE');
  r = r.replace(new RegExp(`(${SINGLE_CLUSTER})\u09CC`, 'g'), (_, cl) => '\u2021' + cl + 'Š');

  // Step 3: Reorder Left Vowels (ি \u09BF, ে \u09C7, ৈ \u09C8): Cluster + [িেৈ] -> [িেৈ] + Cluster
  r = r.replace(new RegExp(`(${SINGLE_CLUSTER})([\u09BF\u09C7\u09C8])`, 'g'), (_, cl, v) => (VOWEL_TO_BIJOY[v] || v) + cl);

  // Step 4: Multi-char Unicode -> Bijoy mapping
  for (const [u, b] of U2B_MULTI) {
    r = replAll(r, u, b);
  }

  // Step 5: Single-char mapping
  r = r.split('').map(c => U2B_SINGLE[c] ?? c).join('');

  // Step 6: Special character cleanups
  r = replAll(r, '\u09D7', 'Š');

  // Step 7: Restore English
  r = restoreEnglish(r, engMap2);

  return r;
}

function detectEncoding(text) {
  if (!text.trim()) return 'unknown';
  const uniCnt = (text.match(/[\u0980-\u09FF]/g)||[]).length;
  const extCnt = (text.match(/[\u00A9\u00AA\u2020\u2021\u2030\u02C6\u0160]/g)||[]).length;
  const total  = text.replace(/\s/g,'').length || 1;
  if (uniCnt/total > 0.3) return 'unicode';
  if (extCnt > 3 || (text.match(/[K-Z_`a-nv-z]/g)||[]).length/total > 0.25) return 'bijoy';
  return 'bijoy'; // default
}

function wc(t) { return t.trim().split(/\s+/).filter(Boolean).length; }
function cc(t) { return t.replace(/\s/g,'').length; }

  // ── Runner ──────────────────────────────────────────────────────────────
  function runTests() {
    const results = [];
    for (const t of TESTS) {
      let actual;
      try {
        actual = t.mode === 'b2u' ? bijoyToUnicode(t.input) : unicodeToBijoy(t.input);
      } catch (e) {
        actual = `[ERROR: ${e.message}]`;
      }
      const pass = actual === t.expected;
      results.push({ ...t, actual, pass });
    }

    // Group by category
    const byCat = {};
    for (const r of results) {
      (byCat[r.cat] = byCat[r.cat] || []).push(r);
    }

    // Summary
    const passed = results.filter(r => r.pass).length;
    const failed = results.filter(r => !r.pass).length;
    document.getElementById('pass-count').textContent = passed;
    document.getElementById('fail-count').textContent = failed;
    document.getElementById('total-count').textContent = results.length;

    // Render
    const root = document.getElementById('results');
    root.innerHTML = '';
    for (const [cat, list] of Object.entries(byCat)) {
      const catFail = list.filter(r => !r.pass).length;
      const sec = document.createElement('div');
      sec.className = 'cat-section';
      sec.innerHTML = `
        <div class="cat-title">
          ${cat}
          <span class="count">${list.length - catFail}/${list.length} passed${catFail > 0 ? ` · <span style="color:var(--red)">${catFail} failed</span>` : ''}</span>
        </div>
        <div class="test-list"></div>`;
      const listEl = sec.querySelector('.test-list');
      for (const r of list) {
        const row = document.createElement('div');
        row.className = 'test ' + (r.pass ? 'pass' : 'fail');
        row.dataset.status = r.pass ? 'pass' : 'fail';
        row.innerHTML = `
          <div class="ico ${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓' : '✗'}</div>
          <div class="label-cell">
            <div class="label">${r.name}${r.note ? ` <small>— ${r.note}</small>` : ''}</div>
            <div class="in">${esc(r.input)}</div>
          </div>
          <div class="expected">${esc(r.expected)}</div>
          <div class="actual ${r.pass ? '' : 'fail-text'}">${esc(r.actual)}</div>`;
        listEl.appendChild(row);
      }
      root.appendChild(sec);
    }

    applyFilters();
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function applyFilters() {
    const showFail = document.getElementById('filter-fail').checked;
    const showPass = document.getElementById('filter-pass').checked;
    document.querySelectorAll('.test').forEach(el => {
      const s = el.dataset.status;
      el.style.display = (s === 'fail' && !showFail) || (s === 'pass' && !showPass) ? 'none' : '';
    });
  }

  document.getElementById('run-btn').addEventListener('click', runTests);
  document.getElementById('filter-fail').addEventListener('change', applyFilters);
  document.getElementById('filter-pass').addEventListener('change', applyFilters);
  document.getElementById('expand-btn').addEventListener('click', () => {
    document.getElementById('filter-fail').checked = true;
    document.getElementById('filter-pass').checked = false;
    applyFilters();
  });
  document.getElementById('collapse-btn').addEventListener('click', () => {
    document.getElementById('filter-fail').checked = false;
    document.getElementById('filter-pass').checked = false;
    applyFilters();
  });

  // Auto-run on load
